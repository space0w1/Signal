# --- One-time setup before applying this file ---
# Signal needs a secret for the Postgres password + LLM provider keys. Create it once,
# directly on the cluster (never commit real values to git, same as the .env pattern
# used for local docker-compose):
#
#   kubectl create secret generic signal-secrets \
#     --namespace signal \
#     --from-literal=postgres-password='<pick-a-password>' \
#     --from-literal=database-url='postgresql://signal:<same-password>@db:5432/signal' \
#     --from-literal=gemini-api-key='<your-gemini-key>' \
#     --from-literal=anthropic-api-key='<your-anthropic-key>'
#
# (Leave a value as '' if you're not using that provider.)

apiVersion: v1
kind: Namespace
metadata:
  name: signal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-postgres
  namespace: signal
spec:
  replicas: 1
  strategy:
    type: Recreate # Kills the old pod before starting a new one so they don't lock the data folder
  selector:
    matchLabels:
      app: signal-postgres
  template:
    metadata:
      labels:
        app: signal-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker1
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "signal"
        - name: POSTGRES_USER
          value: "signal"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: signal-secrets
              key: postgres-password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        hostPath:
          path: /mnt/signal-postgres-data # The local folder on k3s-worker1's drive
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  # Named "db" to match DATABASE_URL's host in app/core/config.py / docker-compose.yml
  name: db
  namespace: signal
spec:
  selector:
    app: signal-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-backend
  namespace: signal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-backend
  template:
    metadata:
      labels:
        app: signal-backend
    spec:
      containers:
      - name: backend
        image: 192.168.2.100:30500/signal-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        # date.today() drives fx_rates.date, news_items.fetched_date and
        # summaries.date. The image is UTC, so without this a 06:00 SGT run
        # (= 22:00 UTC the day before) would write everything under yesterday.
        - name: TZ
          value: "Asia/Singapore"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: signal-secrets
              key: database-url
        - name: LLM_PROVIDER
          value: "gemini"
        - name: GEMINI_MODEL
          value: "gemini-3.5-flash"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: signal-secrets
              key: gemini-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: signal-secrets
              key: anthropic-api-key
---
apiVersion: v1
kind: Service
metadata:
  # Named "backend" to match nginx.conf's proxy_pass target
  name: backend
  namespace: signal
spec:
  selector:
    app: signal-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-frontend
  namespace: signal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-frontend
  template:
    metadata:
      labels:
        app: signal-frontend
    spec:
      containers:
      - name: frontend
        image: 192.168.2.100:30500/signal-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: signal-frontend-service
  namespace: signal
spec:
  type: NodePort
  selector:
    app: signal-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30090 # Open access port for your desktop browser
---
# Nightly maintenance (README: "Nightly Schedule"). Runs the backend image with a
# batch entrypoint instead of curling the API — a full run takes minutes (yfinance
# + article downloads + an LLM call per ticker) and would outlive any HTTP timeout.
# Jenkins' image-tag sed matches this line too, so it tracks the Deployment's tag.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: signal-nightly
  namespace: signal
spec:
  # 06:00 SGT is after the US close (16:00 ET == 04:00-05:00 SGT next day).
  # timeZone needs k8s >= 1.27; on older clusters drop it and use "0 22 * * *" (UTC).
  schedule: "0 6 * * *"
  timeZone: "Asia/Singapore"
  concurrencyPolicy: Forbid      # never let a slow run overlap the next one
  startingDeadlineSeconds: 3600  # homelab node asleep at 06:00? still run, within the hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1            # safe to retry: every write is an upsert or cache hit
      activeDeadlineSeconds: 3000
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: nightly
            image: 192.168.2.100:30500/signal-backend:latest
            imagePullPolicy: Never
            command: ["python", "-m", "app.jobs.nightly"]
            env:
            # date.today() drives fx_rates.date, news_items.fetched_date and
            # summaries.date. The image is UTC, so without this a 06:00 SGT run
            # (= 22:00 UTC the day before) would write everything under yesterday.
            - name: TZ
              value: "Asia/Singapore"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: signal-secrets
                  key: database-url
            - name: LLM_PROVIDER
              value: "gemini"
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash"
            - name: SUMMARY_PREWARM
              value: "true"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: signal-secrets
                  key: gemini-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: signal-secrets
                  key: anthropic-api-key
