server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend at request time instead of caching its IP at
    # startup, so restarting the backend (new container IP) doesn't break /api.
    # NGINX_LOCAL_RESOLVERS is filled from /etc/resolv.conf by the image entrypoint.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Using a variable forces per-request DNS lookup; the original URI
        # (/api/...) is passed through unchanged.
        set $backend_upstream http://${BACKEND_HOST}:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
